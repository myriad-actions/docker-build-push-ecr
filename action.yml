name: 'Build and Push Docker Image to ECR'
description: 'Builds a Docker image and pushes it to Amazon ECR.'

inputs:
  iam-role-aws:
    description: 'The IAM role to assume for AWS credentials.'
    required: true
  aws-region:
    description: 'The AWS region to use.'
    required: true
    default: 'eu-west-1'
  env:
    description: 'The environment (e.g., dev, prod).'
    required: true
  app:
    description: 'The name of the application.'
    required: true
  app-version:
    description: 'The version of the application.'
    required: true
  short-sha:
    description: 'The short SHA of the Git commit.'
    required: true
  dockerfile-path:
    description: 'The path to the Dockerfile.'
    required: true
    default: '.docker/Dockerfile'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.iam-role-aws }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Check if ECR image exists
      id: check-ecr-image
      env:
        VERSION: ${{ inputs.app-version }}-${{ inputs.short-sha }}
      run: |
        set +e
        echo "Checking tag: $VERSION"
        IMAGE_EXISTS=$(aws ecr describe-images \
          --repository-name ${{ inputs.app }} \
          --image-ids imageTag=$VERSION \
          --query 'imageDetails[0].imageTags[0]' \
          --output text 2>/dev/null)
        if [ -z "$IMAGE_EXISTS" ] || [ "$IMAGE_EXISTS" = "None" ] || [ "$IMAGE_EXISTS" = "null" ]; then
          echo "Image does NOT exist."
          echo "exists=false" >> $GITHUB_OUTPUT
        else
          echo "Image EXISTS: $IMAGE_EXISTS"
          echo "exists=true" >> $GITHUB_OUTPUT
        fi
      shell: bash --noprofile --norc -o pipefail

    - name: Output result
      run: |
        echo "Image exists? ${{ steps.check-ecr-image.outputs.exists }}"
      shell: bash

    - name: Set up Docker Buildx
      if: steps.check-ecr-image.outputs.exists == 'false'
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to ECR
      if: steps.check-ecr-image.outputs.exists == 'false'
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        VERSION: ${{ inputs.app-version }}-${{ inputs.short-sha }}
      run: |
        docker buildx build \
          --build-arg GIT_COMMIT_SHA=${{ inputs.short-sha }} \
          --platform linux/amd64 \
          --push \
          -t $REGISTRY/${{ inputs.app }}:${VERSION} \
          -f ${{ inputs.dockerfile-path }} .
      shell: bash
