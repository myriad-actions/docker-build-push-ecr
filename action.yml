name: 'Build and Push Docker Image to ECR'
description: 'Builds a Docker image and pushes it to Amazon ECR.'

inputs:
  iam-role-aws:
    description: 'The IAM role to assume for AWS credentials.'
    required: true
  aws-region:
    description: 'The AWS region to use.'
    required: true
    default: 'eu-west-1'
  env:
    description: 'The environment (e.g., dev, prod).'
    required: true
  app:
    description: 'The name of the application.'
    required: true
  app-version:
    description: 'The version of the application.'
    required: true
  short-sha:
    description: 'The short SHA of the Git commit.'
    required: true
  dockerfile-path:
    description: 'The path to the Dockerfile.'
    required: true
    default: '.docker/Dockerfile'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: install awscli
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
        unzip /tmp/awscliv2.zip -d /tmp/ >/dev/null 2>&1
        /tmp/aws/install -i $HOME/aws-cli -b $HOME/.local/bin >/dev/null 2>&1
        export PATH=$HOME/.local/bin:$PATH
        aws --version
      shell: bash

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.iam-role-aws }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Check if ECR image exists
      id: check-ecr-image
      env:
        VERSION: ${{ inputs.app-version }}-${{ inputs.short-sha }}
      run: |
        set +e
        echo "Checking tag: $VERSION"
        IMAGE_EXISTS=$(aws ecr describe-images \
          --repository-name ${{ inputs.app }} \
          --image-ids imageTag=$VERSION \
          --region ${{ inputs.aws-region }} \
          --query 'imageDetails[0].imageTags[0]' \
          --output text 2>/dev/null)
        if [ -z "$IMAGE_EXISTS" ] || [ "$IMAGE_EXISTS" = "None" ] || [ "$IMAGE_EXISTS" = "null" ]; then
          echo "Image does NOT exist."
          echo "exists=false" >> $GITHUB_OUTPUT
        else
          echo "Image EXISTS: $IMAGE_EXISTS"
          echo "exists=true" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Output result
      run: |
        echo "Image exists? ${{ steps.check-ecr-image.outputs.exists }}"
      shell: bash

    - name: Set up Docker Buildx
      if: steps.check-ecr-image.outputs.exists == 'false'
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image locally
      if: steps.check-ecr-image.outputs.exists == 'false'
      env:
        VERSION: ${{ inputs.app-version }}-${{ inputs.short-sha }}
      run: |
        docker buildx build \
          --build-arg GIT_COMMIT_SHA=${{ inputs.short-sha }} \
          --platform linux/amd64 \
          --load \
          -t ${{ inputs.app }}:${VERSION} \
          -f ${{ inputs.dockerfile-path }} .
      shell: bash
    
    - name:  Run Trivy vulnerability scanner on local image
      uses: aquasecurity/trivy-action@0.28.0
      env:
        VERSION: ${{ inputs.app-version }}-${{ inputs.short-sha }}
        TRIVY_DISABLE_VEX_NOTICE: true
      with:
        image-ref: "${{ inputs.app }}:${{ env.VERSION }}"
        format: 'table'
        output: 'scan-image-trivy.txt'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    
    - name: Display Trivy table in logs & step summary
      run: |
        cat scan-image-trivy.txt
        echo "## Trivy Scan Results" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat scan-image-trivy.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
      shell: bash
    
    - name: Tag and push image to ECR
      if: steps.check-ecr-image.outputs.exists == 'false'
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        VERSION: ${{ inputs.app-version }}-${{ inputs.short-sha }}
      run: |
        docker tag ${{ inputs.app }}:${{ env.VERSION }} $REGISTRY/${{ inputs.app }}:${{ env.VERSION }}
        docker push $REGISTRY/${{ inputs.app }}:${{ env.VERSION }}
      shell: bash